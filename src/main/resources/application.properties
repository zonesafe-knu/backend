spring.application.name=zonesafe_be

# application.properties (? ????? ?? ?? ??)
spring.datasource.url=jdbc:mysql://localhost:3306/zonesafe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Redis ??
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Clip storage
clips.storage.base-path=./storage/clips

# Video storage
videos.storage.base-path=./storage/videos

# Multipart upload (videos up to 500MB)
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB